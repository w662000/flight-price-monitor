name: Flight Price Monitor

on:
  schedule:
    # 每小时整点运行（UTC，即北京时间每小时整点）
    - cron: '0 * * * *'
  workflow_dispatch:
    inputs:
      from_code:
        description: '出发地三字码 (如 WUX)'
        required: true
        default: 'WUX'
      from_name:
        description: '出发地名称 (如 无锡)'
        required: true
        default: '无锡'
      to_code:
        description: '目的地三字码 (如 KMG)'
        required: true
        default: 'KMG'
      to_name:
        description: '目的地名称 (如 昆明)'
        required: true
        default: '昆明'
      depart_dates:
        description: '去程日期, 逗号分隔 (如 2026-11-25,2026-12-01)'
        required: true
        default: '2026-11-25,2026-12-01'
      return_dates:
        description: '回程日期, 逗号分隔 (可选)'
        required: false
        default: ''
      platforms:
        description: '平台: fliggy,tuniu,qunar,tongcheng,ctrip'
        required: false
        default: 'fliggy,tuniu,qunar,tongcheng'
      threshold:
        description: '低价提醒阈值（元）'
        required: false
        default: '600'

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          python -m playwright install chromium --with-deps

      - name: Build config from workflow_dispatch or defaults
        run: |
          python scripts/build_config.py \
            --from-code "${{ github.event.inputs.from_code || 'WUX' }}" \
            --from-name "${{ github.event.inputs.from_name || '无锡' }}" \
            --to-code "${{ github.event.inputs.to_code || 'KMG' }}" \
            --to-name "${{ github.event.inputs.to_name || '昆明' }}" \
            --dates "${{ github.event.inputs.depart_dates || '2026-11-25,2026-12-01' }}" \
            --return-dates "${{ github.event.inputs.return_dates || '' }}" \
            --platforms "${{ github.event.inputs.platforms || 'fliggy,tuniu,qunar,tongcheng' }}" \
            --threshold "${{ github.event.inputs.threshold || '600' }}" \
            --serverchan-key "${{ secrets.SERVERCHAN_KEY }}" \
            --mail-user "w662000@126.com" \
            --mail-to "w662000@126.com" \
            --mail-pass "${{ secrets.MAIL_PASS }}" \
            --output config.yaml

      - name: Run price monitor (one round)
        run: python main.py --once
        timeout-minutes: 15

      - name: Export latest results to JSON
        run: |
          mkdir -p docs/data
          python scripts/export_results.py \
            --db data/prices.db \
            --out docs/data/latest.json

      - name: Render HTML report
        run: |
          python scripts/render_report.py \
            --results-file docs/data/latest.json \
            --out-dir docs/data

      - name: Commit data & report
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f docs/data/
          git diff --staged --quiet || git commit -m "chore: update price data $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push
